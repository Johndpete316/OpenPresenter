[package]
name = "app"
description = "PP6 replacement: output window (M2 spike); operator UI arrives in M3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pp6"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
crossbeam-channel = "0.5.17"
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
pro6.workspace = true
raw-window-handle = "0.6"
render.workspace = true
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winit = "0.30"

# Not inheriting workspace lints: GL calls are inherently `unsafe`, so this crate
# uses `deny` (allowed only inside the GL module) instead of the workspace `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
