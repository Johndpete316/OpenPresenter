[package]
name = "media"
description = "libmpv (loaded at runtime) for background images/video, rendered into a caller's GL framebuffer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

# FFI needs `unsafe`: deny crate-wide, allowed only in the FFI/player modules.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
