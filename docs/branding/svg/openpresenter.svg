<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OpenPresenter</title>
  <defs>
    <linearGradient id="op-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A31"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="op-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA845"/>
      <stop offset="1" stop-color="#F06A1D"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect id="tile" x="16" y="16" width="480" height="480" rx="108" fill="url(#op-bg)"/>
  <rect id="tile-edge" x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <g id="mark" transform="translate(0 10)">
    <!-- stand (drawn first so the screen overlaps the neck) -->
    <path id="stand-neck" d="M 240 320 H 272 L 276 380 H 236 Z" fill="url(#op-accent)"/>
    <rect id="stand-base" x="180" y="372" width="152" height="28" rx="14" fill="url(#op-accent)"/>
    <!-- screen: rounded frame, open at top-right -->
    <path id="screen" d="M 296 118 H 186 A 70 70 0 0 0 116 188 V 256 A 70 70 0 0 0 186 326 H 326 A 70 70 0 0 0 396 256 V 238"
          fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <!-- lyric lines -->
    <rect id="line-1" x="186" y="186" width="140" height="22" rx="11" fill="#FFFFFF"/>
    <rect id="line-2" x="206" y="230" width="100" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.55"/>
    <!-- advance arrow (same geometry as arrow.svg, offset 337,85) -->
    <path id="arrow" d="M 354 102 L 404 152 L 354 202" fill="none" stroke="url(#op-accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
