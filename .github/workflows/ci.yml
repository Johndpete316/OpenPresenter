# Checks on Windows, the only platform OpenPresenter ships for. A pass on main
# triggers the installer build (release.yml).
name: CI

on:
  push:
    branches: ['**'] # not tags (release assets create tags)
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Render tests use only the bundled fixture fonts; media tests skip when libmpv is absent.
      - run: cargo nextest run --workspace --locked --no-fail-fast
