[workspace]
resolver = "3"
members = ["crates/pro6", "crates/core", "crates/render", "crates/media", "crates/app", "crates/pp6tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
pro6 = { path = "crates/pro6" }
render = { path = "crates/render" }
pp6core = { path = "crates/core" }
media = { path = "crates/media" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"   # readable backtraces in crash reports
